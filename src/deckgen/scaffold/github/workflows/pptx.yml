name: Build PowerPoints

# On every push to main (or by hand): build the plain and the ClassPoint PowerPoints,
# the activity manifests, the .docx documents and the preview sheets, and keep them as
# a workflow artifact. Nothing is published — download it from Actions → this run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # the artifact is named in deckgen.toml, so the roster of courses stays in one file
      - id: cfg
        run: echo "artifact=$(python -c 'from deckgen.project import Project; print(Project.load().artifact)')" >> "$GITHUB_OUTPUT"
      - name: Build PowerPoints, documents and previews
        run: deckgen build --pptx
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artifact }}
          path: |
            export/*.pptx
            export/*.json
            export/docs/
            export/preview/*.jpg
          retention-days: 90
